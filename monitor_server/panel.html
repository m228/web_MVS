<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web_MVS панель</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#2563eb">
<style>
:root {
  --bg: #f1f4fa; --card: #ffffff; --text: #142133; --muted: #5b6b81; --line: #dde4f0;
  --ok: #16a34a; --ok-bg: rgba(22,163,74,.14); --warn: #d97706; --warn-bg: rgba(217,119,6,.15);
  --bad: #dc2626; --bad-bg: rgba(220,38,38,.13); --accent: #2563eb; --idle-bg: rgba(91,107,129,.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1623; --card: #172033; --text: #e7eefb; --muted: #99aac7; --line: #28344c;
    --ok: #4ade80; --ok-bg: rgba(74,222,128,.16); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.16);
    --bad: #f87171; --bad-bg: rgba(248,113,113,.17); --accent: #60a5fa; --idle-bg: rgba(153,170,199,.16);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 18px 24px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; flex: 1; display: flex; align-items: center; gap: 12px; }
h1 img { width: 34px; height: 34px; }
#upd { color: var(--muted); font-size: 13px; }
button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 0 24px 32px; align-items: start; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 40px 0; text-align: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.card.s-offline { border-color: var(--bad); }
.card.has-alert { border-color: var(--warn); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h2 { margin: 0; font-size: 19px; }
.chip { padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--idle-bg); color: var(--muted); }
.chip.s-online { background: var(--ok-bg); color: var(--ok); }
.chip.s-offline { background: var(--bad-bg); color: var(--bad); }
.chip.s-checking { background: var(--warn-bg); color: var(--warn); }
.sub { color: var(--muted); font-size: 13px; }
.sub .bad { color: var(--bad); font-weight: 600; }
pre.text { margin: 0; font: inherit; font-size: 14px; white-space: pre-wrap; line-height: 1.65; }
.card.s-offline pre.text, .card.s-waiting pre.text { opacity: .55; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { border-left: 4px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.alert.bad { border-color: var(--bad); background: var(--bad-bg); }
.alert small { color: var(--muted); margin-left: 8px; }
.tools { display: flex; gap: 14px; flex-wrap: wrap; }
.tools button { border: 0; background: none; padding: 2px 0; color: var(--muted); font-size: 13px; }
.tools button:hover { color: var(--accent); }
.log { display: none; max-height: 300px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 6px; }
.log.open { display: block; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 3px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
.row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.row.critical, .row.high { color: var(--bad); }
.row.medium { color: var(--warn); }
dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; max-width: 520px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; }
dialog p { margin: 6px 0; color: var(--muted); font-size: 14px; }
dialog code { color: var(--text); word-break: break-all; }
.tok { display: flex; gap: 8px; margin: 12px 0; }
.tok input { flex: 1; min-width: 0; font: 13px ui-monospace, Consolas, monospace; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; }
@media (max-width: 600px) {
  header { padding: 12px 14px; gap: 10px; }
  h1 { font-size: 18px; }
  main { grid-template-columns: 1fr; padding: 0 12px 24px; gap: 12px; }
}
</style>
</head>
<body>
<header>
  <h1><img src="/icon-192.png" alt="">Мониторинг заводов</h1>
  <span id="upd"></span>
  <button id="add" class="primary">+ Завод</button>
</header>
<main id="cards"><div class="empty">Загрузка…</div></main>

<dialog id="dlg">
  <h3 id="dlgTitle">Токен завода</h3>
  <p>Токен показывается один раз. В приложении завода: страница «Мониторинг» →</p>
  <p>Адрес сервера: <code id="dlgUrl"></code><br>Завод: <code id="dlgName"></code></p>
  <div class="tok"><input id="dlgTok" readonly><button id="dlgCopy">Копировать</button></div>
  <div class="err" id="dlgErr"></div>
  <div style="text-align:right"><button id="dlgClose">Закрыть</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const STATUS = {online: 'в сети', offline: 'нет связи', waiting: 'ждёт первого пульса', checking: 'проверяю связь'};
const RANK = {offline: 0, checking: 2, waiting: 3, online: 4};
// строку «Тревоги: …» из текста завода не показываем: ниже те же тревоги отдельными плашками с временем
const opened = new Set();           // у каких заводов раскрыт журнал
let plants = [], serverT = Date.now() / 1000;

const fmt = (t) => new Date(t * 1000).toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 90) return 'только что';
  if (s < 5400) return Math.round(s / 60) + ' мин назад';
  if (s < 172800) return Math.round(s / 3600) + ' ч назад';
  return Math.round(s / 86400) + ' д назад';
}
async function api(path, opts = {}) {
  const r = await fetch(path, {cache: 'no-store', ...opts, headers: {'X-Panel': '1', 'Content-Type': 'application/json', ...(opts.headers || {})}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function card(p) {
  const snap = p.snapshot || {};
  const bad = p.alerts.some((a) => a.level === 'critical' || a.level === 'high');
  let sub;
  if (p.status === 'waiting') sub = 'ещё не выходил на связь';
  else if (p.status === 'offline') sub = '<span class="bad">нет пульса — последний ' + esc(dur(serverT - p.last_seen_t)) + '</span>';
  else sub = (snap.app_version ? 'v' + esc(snap.app_version) + ' · ' : '') + 'пульс ' + esc(dur(serverT - p.last_seen_t));
  const alerts = p.alerts.map((a) => '<div class="alert' + (a.level === 'critical' || a.level === 'high' ? ' bad' : '') + '"><b>' + esc(a.text) +
    '</b><small>с ' + fmt(a.since) + '</small></div>').join('');
  return '<article class="card s-' + p.status + (p.alerts.length ? ' has-alert' : '') + '" data-id="' + p.id + '">' +
    '<div class="head"><h2>' + esc(p.name) + '</h2><span class="chip s-' + p.status + '">' + STATUS[p.status] + '</span></div>' +
    '<div class="sub">' + sub + '</div>' +
    (snap.text ? '<pre class="text">' + esc(snap.text.split('\n').filter((l) => !l.startsWith('Тревоги:')).join('\n')) + '</pre>' : '') +
    (alerts ? '<div class="alerts">' + alerts + '</div>' : '') +
    '<div class="tools"><button data-a="log">Журнал</button><button data-a="token">Новый токен</button><button data-a="del">Удалить</button></div>' +
    '<div class="log' + (opened.has(p.id) ? ' open' : '') + '" id="log' + p.id + '"></div></article>';
}

function sorted() {
  const w = (p) => (RANK[p.status] ?? 5) - (p.alerts.some((a) => a.level === 'critical' || a.level === 'high') ? 1.5 : 0);
  return [...plants].sort((a, b) => w(a) - w(b) || a.name.localeCompare(b.name, 'ru'));
}

function titleBadge() {
  // число заводов, где что-то не так, — в заголовке окна: видно и в свёрнутом окне на панели задач
  const n = plants.filter((p) => p.status === 'offline' || p.alerts.some((a) => a.level === 'critical' || a.level === 'high')).length;
  document.title = (n ? '(' + n + ') ' : '') + 'web_MVS панель';
}

function render() {
  titleBadge();
  const box = $('cards');
  box.innerHTML = plants.length ? sorted().map(card).join('') : '<div class="empty">Заводов пока нет. Нажми «+ Завод», чтобы выдать токен.</div>';
  opened.forEach((id) => loadLog(id));
}

async function loadLog(id) {
  try {
    const j = await api('/api/plants/' + id + '/events?limit=60');
    const el = $('log' + id);
    if (el) el.innerHTML = j.events.map((e) => '<div class="row ' + esc(e.level) + '"><span class="t">' + fmt(e.t) + '</span><span>' + esc(e.text) + '</span></div>').join('')
      || '<div class="sub">Записей пока нет.</div>';
  } catch (e) { /* журнал догрузится на следующем опросе */ }
}

async function load() {
  try {
    const j = await api('/api/plants');
    plants = j.plants; serverT = j.server_t;
    $('upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU');
    render();
  } catch (e) { $('upd').textContent = 'нет связи с сервером: ' + e.message; }
}

function showToken(title, name, token) {
  $('dlgTitle').textContent = title;
  $('dlgUrl').textContent = location.origin;
  $('dlgName').textContent = name;
  $('dlgTok').value = token;
  $('dlgErr').textContent = '';
  $('dlg').showModal();
  $('dlgTok').select();
}

$('add').onclick = async () => {
  const name = (prompt('Название завода (как будет на карточке):') || '').trim();
  if (!name) return;
  try {
    const j = await api('/api/plants', {method: 'POST', body: JSON.stringify({name})});
    showToken('Завод «' + name + '» добавлен', name, j.token);
    load();
  } catch (e) { alert(e.message); }
};
$('dlgClose').onclick = () => $('dlg').close();
$('dlgCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('dlgTok').value); $('dlgErr').textContent = 'Скопировано'; }
  catch (e) { $('dlgTok').select(); $('dlgErr').textContent = 'Выделено — нажми Ctrl+C'; }
};

$('cards').onclick = async (ev) => {
  const btn = ev.target.closest('button[data-a]');
  if (!btn) return;
  const id = Number(btn.closest('.card').dataset.id);
  const p = plants.find((x) => x.id === id);
  if (btn.dataset.a === 'log') {
    if (opened.has(id)) opened.delete(id); else opened.add(id);
    $('log' + id).classList.toggle('open', opened.has(id));
    if (opened.has(id)) loadLog(id);
  } else if (btn.dataset.a === 'token') {
    if (!confirm('Выдать «' + p.name + '» новый токен? Старый перестанет работать — его нужно заново ввести в приложении завода.')) return;
    try { const j = await api('/api/plants/' + id + '/token', {method: 'POST'}); showToken('Новый токен', p.name, j.token); }
    catch (e) { alert(e.message); }
  } else if (btn.dataset.a === 'del') {
    if (!confirm('Удалить завод «' + p.name + '» вместе с журналом? Это нельзя отменить.')) return;
    try { await api('/api/plants/' + id, {method: 'DELETE'}); opened.delete(id); load(); }
    catch (e) { alert(e.message); }
  }
};

load();
setInterval(() => { if (!document.hidden) load(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
