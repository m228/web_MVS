<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan Camera</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/js/logger.js"></script>
  <script src="/static/js/theme.js" defer></script>
</head>
<body>
  <div class="layout">
    <main class="content">
      <div class="app-shell">
        <header class="topbar">
          <div class="theme-panel">
            <span class="theme-panel__label">Тема интерфейса</span>
            <div class="theme-switcher" data-theme-switcher></div>
          </div>

          <div class="brand-slot" aria-label="Логотип компании">
            <div class="brand-slot__logo-wrap">
              <a class="brand-link" href="https://max-automation.ru/" target="_blank" rel="noopener" title="Перейти на сайт Maximum Automation">
                <img
                  class="brand-logo"
                  data-theme-logo
                  data-logo-light="/static/icon/Logo_Black.png"
                  data-logo-dark="/static/icon/Logo_White.png"
                  src="/static/icon/Logo_Black.png"
                  alt="MA logo"
                />
              </a>
            </div>
          </div>
        </header>

        <section class="card page-hero">
          <div class="page-hero__content">
            <p class="page-hero__eyebrow">Поиск камер</p>
            <h1 class="page-hero__title">Scan Camera</h1>
            <p class="page-hero__subtitle">
              Укажите подсеть и пароли — сервер найдёт RTSP-камеры и снимет с каждой кадр.
              Двойной клик по превью добавляет камеру в список RTSP.
            </p>
          </div>

          <div class="page-hero__actions">
            <a href="/" class="btn btn-secondary">К списку камер</a>
            <button type="button" id="logsBtn" class="btn toolbar-btn--logs" title="Открыть журнал">
              Логи
              <span class="log-counter" id="logCounter">0</span>
            </button>
          </div>
        </section>

        <section class="card table-card">
          <form id="scanForm" class="scan-form">
            <label class="scan-f scan-f--net"><span>Подсеть</span>
              <input name="prefix" class="field-input" value="192.168.1" placeholder="10.32.2" autocomplete="off" /></label>
            <label class="scan-f scan-f--num"><span>От</span>
              <input name="first" class="field-input" type="number" min="0" max="255" value="1" /></label>
            <label class="scan-f scan-f--num"><span>До</span>
              <input name="last" class="field-input" type="number" min="0" max="255" value="254" /></label>
            <label class="scan-f"><span>Логин</span>
              <input name="user" class="field-input" value="admin" autocomplete="off" /></label>
            <label class="scan-f scan-f--pw"><span>Пароли (через пробел или запятую)</span>
              <input name="passwords" class="field-input" type="password" autocomplete="new-password" /></label>
            <button type="submit" id="scanStartBtn" class="btn btn-primary">Сканировать</button>
            <button type="button" id="scanStopBtn" class="btn btn-secondary hidden">Стоп</button>
          </form>
          <div class="scan-status" id="scanStatus"></div>
          <div class="scan-album" id="scanAlbum"></div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="scanAddDlg" class="scan-dlg">
    <form method="dialog" id="scanAddForm">
      <h3 id="scanAddTitle">Добавить камеру</h3>
      <label class="scan-f"><span>Логин</span><input name="user" class="field-input" autocomplete="off" /></label>
      <label class="scan-f"><span>Пароль</span><input name="password" class="field-input" type="password" autocomplete="new-password" /></label>
      <p class="scan-dlg__hint" id="scanAddHint"></p>
      <div class="scan-dlg__btns">
        <button type="button" id="scanAddCancel" class="btn btn-secondary">Отмена</button>
        <button type="submit" class="btn btn-primary">Добавить</button>
      </div>
    </form>
  </dialog>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/scan.js"></script>
</body>
</html>
